[versions]
binance-sdk = "1.0.2"
kotlin = "2.1.21"
agp = "8.10.1"

android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

coroutines = "1.10.1"
serialization = "1.3.2"
ktor = "3.1.3"
concurrent-collections = "2.0.0"
kotlinx-datetime = "0.6.2"
cryptography = "0.4.0"
dokka = "2.0.0"

slf4jJ = "2.0.16"
koin-core = "4.0.0-RC1"
jreleaser = "1.14.0"
kmm-publish = "0.32.0"

jupiter = "5.8.1"

[libraries]
# slf4j
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jJ" }

## coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
concurrent-collections = { module = "co.touchlab:stately-concurrent-collections", version.ref = "concurrent-collections"}

## serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

## cryptography
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography"}
cryptography-jvm = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography"}
cryptography-ios = { module = "dev.whyoleg.cryptography:cryptography-provider-apple", version.ref = "cryptography"}
cryptography-js = { module = "dev.whyoleg.cryptography:cryptography-provider-webcrypto", version.ref = "cryptography"}

## ktor-client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-socket = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }

ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-ios = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-jvm = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }

# gradle

gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-kotlinx-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin-core" }

# tests
jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "jupiter"}
jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "jupiter"}

[plugins]
jreleaser = { id = "org.jreleaser", version.ref = "jreleaser" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kmm-publish = { id = "com.vanniktech.maven.publish", version.ref = "kmm-publish"}
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka"}
[bundles]

ktor = [
    "ktor-client-core",
#    "ktor-client-cio",
    "ktor-client-contentNegotiation",
    "ktor-client-serialization",
    "ktor-client-logging",
    "ktor-client-socket"
]